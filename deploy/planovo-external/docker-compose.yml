services:
  edge:
    image: caddy:2.8-alpine
    container_name: planovo-pro-edge
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Приём заявок с сайта и переписка через Telegram-бота. Слушает только 127.0.0.1:18090,
  # снаружи доступен через edge по пути /lead. Токен и номер группы — в lead.env рядом,
  # файл кладётся на сервер один раз и в репозиторий не попадает.
  lead:
    image: python:3.12-alpine
    container_name: planovo-pro-lead
    restart: unless-stopped
    network_mode: host
    command: ["python", "-u", "/app/lead.py"]
    env_file: ./lead.env
    volumes:
      - ./lead/lead.py:/app/lead.py:ro
      - ./lead-state:/state
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18090/lead/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
